plugins {
    id 'com.android.application'
}

// Read version from VERSION file
def versionFile = rootProject.file('VERSION')
def codeVersionFile = rootProject.file('CODE_VERSION')
def appVersion = versionFile.exists() ? versionFile.text.trim() : "0.0"
def codeVersion = codeVersionFile.exists() ? codeVersionFile.text.trim() : "1"

android {
    namespace 'com.qft8.morsekeyer'
    compileSdk 36

    defaultConfig {
        applicationId "com.qft8.morsekeyer"
        minSdk 24
        targetSdk 36
        versionCode codeVersion.toInteger()
        versionName appVersion

        // Keep only English resources
        resConfigs "en"

        // Expose version to Java code via BuildConfig
        buildConfigField "String", "APP_VERSION", "\"${appVersion}\""
        buildConfigField "boolean", "CHEAT_MODE", project.hasProperty('cheatMode') ? "true" : "false"
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            def keystoreProperties = new Properties()
            def keystorePropertiesFile = rootProject.file('local.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }

            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// Configure Toolchain to use JDK 25 (found in installations.paths)
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}
